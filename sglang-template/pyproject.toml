[project]
name = "bentosglang"
version = "0.1.0"
description = "Self-host LLMs with SGLang and BentoML"
requires-python = ">=3.12.0"
dependencies = [
    "bentoml==1.4.33",
    "fastapi>=0.100",
    "httpx>=0.25",
    "pydantic>=2.0",
]

[tool.bentoml.build]
service = "service.py:SGL"
include = [
  "*.py",
  "*.toml",
  "*.txt",
  "uv.lock",
  "*.yaml",
]

[tool.bentoml.build.docker]
base_image = "voipmonitor/sglang:cu130-fix"
dockerfile_template = "./docker/Dockerfile.template.j2"
