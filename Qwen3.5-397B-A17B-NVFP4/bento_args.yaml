# bento_args.yaml

# ========== 基础配置 ==========
name: "Qwen3.5"
engine_port: 8000

# ========== vLLM 参数 ==========
cli_args:
  - "--model"
  - "/models/Qwen3.5-397B-A17B-NVFP4"
  - "--reasoning-parser"
  - "qwen3"
  - "--tool-call-parser"
  - "qwen3_coder"
  - "--tensor-parallel-size"
  - "4"
  - "--quantization"
  - "modelopt_fp4"
  - "--kv-cache-dtype"
  - "fp8_e4m3"
  - "--trust-remote-code"
  - "--cuda-graph-max-bs"
  - "16"
  - "--max-running-requests"
  - "16"
  - "--mem-fraction-static"
  - "0.8"
  - "--chunked-prefill-size"
  - "4096"
  - "--attention-backend"
  - "flashinfer"
  - "--fp4-gemm-backend"
  - "b12x"
  - "--moe-runner-backend"
  - "b12x"
  - "--enable-pcie-oneshot-allreduce"
  - "--enable-metrics"
  - "--sleep-on-idle"
  - "--speculative-algo"
  - "NEXTN"
  - "--speculative-num-steps"
  - "4"
  - "--speculative-eagle-topk"
  - "1"
  - "--speculative-num-draft-tokens"
  - "6"
  - "--mamba-scheduler-strategy"
  - "extra_buffer"
  - "--enable-cache-report"
  - "--limit-mm-data-per-request"
  - '{"image":1}'