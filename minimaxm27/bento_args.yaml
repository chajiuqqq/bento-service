# bento_args.yaml

# ========== 基础配置 ==========
name: "minimax-m27"
engine_port: 8000

# ========== vLLM 参数 ==========
cli_args:
  - "--model"
  - "/models/MiniMax-M2.7"
  - --trust-remote-code
  - --enable-auto-tool-choice
  - "--tensor-parallel-size"
  - "4"
  - "--pipeline-parallel-size"
  - "1"
  - --tool-call-parser
  - minimax_m2
  - --reasoning-parser
  - minimax_m2
  - --gpu-memory-utilization
  - "0.8"
  - --max-model-len
  - 192k
  - --max-num-batched-tokens
  - 16k
  - --max-num-seqs
  - "32"
  - --disable-custom-all-reduce
  - --kv-cache-dtype
  - fp8
  - --kv-offloading-size
  - "100"
  - --disable-hybrid-kv-cache-manager
  - --enable-prompt-tokens-details