apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-0.8b-bento-builder
  namespace: yatai
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bento-builder
          image: registry.pintechs.com/cg-img-base/python:3.12-slim
          command:
            - /bin/bash
            - -c
            - |
              cd /workdir && uv pip install -r requirements.txt --index https://mirrors.aliyun.com/pypi/simple/
              bentoml build --arg-file bento_args.yaml --name qwen3-0.8b --version latest
              bentoml push qwen3-0.8b:latest
          env:
            - name: BENTO_NAME
              value: qwen3-0.8b
            - name: BENTO_VERSION
              value: latest
          envFrom:
            - configMapRef:
                name: bento-config
          volumeMounts:
            - name: workdir
              mountPath: /workdir
            - name: bento-args
              mountPath: /workdir/bento_args.yaml
              subPath: bento_args.yaml
      volumes:
        - name: workdir
          hostPath:
            path: /Work/bento-service/qwen3-0.8b
            type: Directory
        # bento_args.yaml 由业务系统动态生成，按构建创建 ConfigMap 后挂入
        - name: bento-args
          configMap:
            name: bento-args-qwen3-0.8b-latest
