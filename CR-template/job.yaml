apiVersion: batch/v1
kind: Job
metadata:
  name: ${BENTO_NAME}-${BENTO_VERSION}-bento-builder
  namespace: ${BENTO_NAMESPACE:-yatai}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bento-builder
          image: registry.pintechs.com/cg-img-base/bento-builder:v1.0.0
          command:
            - /bin/bash
            - -c
            - |
              # 任何一步失败立即以非零码退出，Pod 标记 Failed，交给 backoffLimit 做 Pod 级重试
              set -euo pipefail

              echo "=== [1/4] 安装依赖 ==="
              cd "/workdir/${BENTO_SERVICE_DIR}"
              uv pip install --system -r requirements.txt --index https://mirrors.aliyun.com/pypi/simple/

              echo "=== [2/4] 应用 base_image 到 pyproject.toml ==="
              if [[ -n "${BENTO_BASE_IMAGE:-}" ]]; then
              python3 - <<'PYEOF'
              import os
              import pathlib
              import re

              base_image = os.environ["BENTO_BASE_IMAGE"]
              pyproject = pathlib.Path("/workdir") / os.environ["BENTO_SERVICE_DIR"] / "pyproject.toml"
              text = pyproject.read_text()
              if re.search(r"^base_image\s*=", text, re.MULTILINE):
                  text = re.sub(
                      r"^base_image\s*=.*$",
                      lambda _: 'base_image= "' + base_image + '"',
                      text,
                      count=1,
                      flags=re.MULTILINE,
                  )
              else:
                  text = text.replace(
                      "[tool.bentoml.build.docker]",
                      '[tool.bentoml.build.docker]\nbase_image= "' + base_image + '"',
                      1,
                  )
              pyproject.write_text(text)
              print("base_image -> " + base_image)
              PYEOF
              else
                echo "BENTO_BASE_IMAGE 未设置，使用 pyproject.toml 中的默认 base_image"
              fi

              echo "=== [3/4] 构建 bento ==="
              if [[ ! -f bento_args.yaml ]]; then
                echo "错误: bento_args.yaml 不存在，ConfigMap bento-args-$BENTO_NAME-$BENTO_VERSION 是否已创建？" >&2
                exit 1
              fi
              bentoml build --arg-file bento_args.yaml --name "$BENTO_NAME" --version "$BENTO_VERSION"
              bentoml get "$BENTO_NAME:$BENTO_VERSION"
              
              echo "=== [4/4] 推送 bento ==="
              # push 是网络操作最易抖动；就地重试一次，避免 Pod 级重试重跑整个 build
              if ! bentoml push "$BENTO_NAME:$BENTO_VERSION"; then
                echo "push 失败，15s 后重试一次..." >&2
                sleep 15
                bentoml push "$BENTO_NAME:$BENTO_VERSION"
              fi
          env:
            - name: BENTO_NAME
              value: ${BENTO_NAME}
            - name: BENTO_VERSION
              value: ${BENTO_VERSION}
            # 镜像内已内置项目代码（/workdir/${BENTO_SERVICE_DIR}）
            - name: BENTO_SERVICE_DIR
              value: ${BENTO_SERVICE_DIR}
            - name: BENTO_BASE_IMAGE
              value: ${BENTO_BASE_IMAGE}
          envFrom:
            - configMapRef:
                name: yatai-cloud-config
          volumeMounts:
            - name: bento-args
              mountPath: /workdir/${BENTO_SERVICE_DIR}/bento_args.yaml
              subPath: bento_args.yaml
      volumes:
        # bento_args.yaml 由业务系统动态生成，按构建创建 ConfigMap 后挂入
        - name: bento-args
          configMap:
            name: bento-args-${BENTO_NAME}-${BENTO_VERSION}
