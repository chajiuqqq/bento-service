apiVersion: batch/v1
kind: Job
metadata:
  name: qwen36-20260805-1624-abcd-bento-builder
  namespace: bento-dev
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bento-builder
          image: registry.pintechs.com/cg-img-base/astral/uv:python3.12-bookworm-slim
          command:
            - /bin/bash
            - -c
            - |
              # 任何一步失败立即以非零码退出，Pod 标记 Failed，交给 backoffLimit 做 Pod 级重试
              set -euo pipefail

              echo "=== [1/5] 从 S3 下载并解压项目 ==="
              uv pip install --system boto3 --index https://mirrors.aliyun.com/pypi/simple/
              python3 - <<'PYEOF'
              import os
              from boto3 import client
              from botocore.config import Config

              s3 = client(
                  "s3",
                  endpoint_url=os.environ["S3_ENDPOINT"],
                  aws_access_key_id=os.environ["S3_ACCESS_KEY"],
                  aws_secret_access_key=os.environ["S3_SECRET_KEY"],
                  config=Config(s3={"addressing_style": "path"}),
                  # s3.pintechs.com 使用内网自签 CA，使用 ConfigMap 挂载的根证书做校验
                  verify="/etc/ssl/s3-ca/s3-ca.crt",
              )
              s3.download_file(
                  os.environ["S3_BUCKET"], os.environ["S3_KEY"], "/workdir/bento-service.zip"
              )
              print("已下载: /workdir/bento-service.zip")
              PYEOF
              cd /workdir
              python3 - <<'PYEOF'
              import os
              import shutil
              import zipfile

              zip_path = "/workdir/bento-service.zip"
              src = "/workdir/src_tmp"
              os.makedirs(src, exist_ok=True)
              with zipfile.ZipFile(zip_path) as zf:
                  zf.extractall(src)
              # 若 zip 只含单层顶层目录（如 bento-service/），展开为项目根
              entries = os.listdir(src)
              if len(entries) == 1 and os.path.isdir(os.path.join(src, entries[0])):
                  src = os.path.join(src, entries[0])

              def merge(src_item, dst):
                  # bento_args.yaml 由 ConfigMap 挂载提供，任何来源都不可覆盖
                  if os.path.basename(src_item) == "bento_args.yaml":
                      return
                  if os.path.isdir(src_item):
                      # 目标目录可能已存在（如 bento_args.yaml 挂载点），递归合并而非整体移动
                      os.makedirs(dst, exist_ok=True)
                      for name in os.listdir(src_item):
                          merge(os.path.join(src_item, name), os.path.join(dst, name))
                  else:
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.move(src_item, dst)

              for name in os.listdir(src):
                  merge(os.path.join(src, name), os.path.join("/workdir", name))
              shutil.rmtree("/workdir/src_tmp", ignore_errors=True)
              os.remove(zip_path)
              print("项目已就绪于 /workdir")
              PYEOF

              echo "=== [2/5] 安装依赖 ==="
              cd "/workdir/qwen36"
              uv pip install --system -r requirements.txt --index https://mirrors.aliyun.com/pypi/simple/

              echo "=== [3/5] 应用 base_image 到 pyproject.toml ==="
              if [[ -n "registry.pintechs.com/cg-img-base/vllm/vllm-openai:v0.25.2" ]]; then
              python3 - <<'PYEOF'
              import os
              import pathlib
              import re

              base_image = os.environ["BENTO_BASE_IMAGE"]
              pyproject = pathlib.Path("/workdir") / os.environ["BENTO_SERVICE_DIR"] / "pyproject.toml"
              text = pyproject.read_text()
              if re.search(r"^base_image\s*=", text, re.MULTILINE):
                  text = re.sub(
                      r"^base_image\s*=.*$",
                      lambda _: 'base_image= "' + base_image + '"',
                      text,
                      count=1,
                      flags=re.MULTILINE,
                  )
              else:
                  text = text.replace(
                      "[tool.bentoml.build.docker]",
                      '[tool.bentoml.build.docker]\nbase_image= "' + base_image + '"',
                      1,
                  )
              pyproject.write_text(text)
              print("base_image -> " + base_image)
              PYEOF
              else
                echo "BENTO_BASE_IMAGE 未设置，使用 pyproject.toml 中的默认 base_image"
              fi

              echo "=== [4/5] 构建 bento ==="
              if [[ ! -f bento_args.yaml ]]; then
                echo "错误: bento_args.yaml 不存在，ConfigMap bento-args-qwen36-20260805-1624-abcd 是否已创建？" >&2
                exit 1
              fi
              bentoml build --arg-file bento_args.yaml --name "qwen36" --version "20260805-1624-abcd"
              bentoml get "qwen36:20260805-1624-abcd"
              
              echo "=== [5/5] 推送 bento ==="
              # push 是网络操作最易抖动；就地重试一次，避免 Pod 级重试重跑整个 build
              if ! bentoml push "qwen36:20260805-1624-abcd"; then
                echo "push 失败，15s 后重试一次..." >&2
                sleep 15
                bentoml push "qwen36:20260805-1624-abcd"
              fi
          env:
            - name: BENTO_NAME
              value: qwen36
            - name: BENTO_VERSION
              value: 20260805-1624-abcd
            # zip 解压后的服务子目录（如 qwen36/），后续构建均在该目录下进行
            - name: BENTO_SERVICE_DIR
              value: qwen36
            - name: BENTO_BASE_IMAGE
              value: registry.pintechs.com/cg-img-base/vllm/vllm-openai:v0.25.2
            # ===== S3 下载项目（S3 兼容存储，如 MinIO）=====
            - name: S3_ENDPOINT
              value: https://s3.pintechs.com
            - name: S3_BUCKET
              value: chaoguang
            - name: S3_KEY
              value: work/bento-service.zip
            - name: S3_ACCESS_KEY
              value: chaoguang
            - name: S3_SECRET_KEY
              value: MWYkn3EWYlTIlyHGmgbQuGIVaSPJYL8eCXxaRhcY
          envFrom:
            - configMapRef:
                name: yatai-cloud-config
          volumeMounts:
            # 构建工作目录：emptyDir，每次 Job 全新，可安全修改 pyproject.toml
            - name: workdir
              mountPath: /workdir
            - name: bento-args
              mountPath: /workdir/qwen36/bento_args.yaml
              subPath: bento_args.yaml
            # 内网 S3 根证书：由 kubectl create configmap s3-ca-cert --from-file=s3-ca.crt 创建
            - name: s3-ca
              mountPath: /etc/ssl/s3-ca
              readOnly: true
      volumes:
        - name: workdir
          emptyDir: {}
        # bento_args.yaml 由业务系统动态生成，按构建创建 ConfigMap 后挂入
        - name: bento-args
          configMap:
            name: bento-args-qwen36-20260805-1624-abcd
        - name: s3-ca
          configMap:
            name: s3-ca-cert
